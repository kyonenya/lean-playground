name = "lean-playground"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanGameServer", "NatCommMonoid"]

[leanOptions]
pp.unicode.fun = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.2"

[[lean_lib]]
name = "LeanGameServer"
globs = ["LeanGameServer.+"]

[[lean_lib]]
name = "NatCommMonoid"
globs = ["NatCommMonoid.+"]
